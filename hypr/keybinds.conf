# claude-waybar — Hyprland key bindings.
#
# Sourced into wayland.windowManager.hyprland.extraConfig by the flake module.
# All binaries are provided on $PATH via home.packages (writeShellScriptBin),
# so bare command names work — no absolute paths.

# Open (or attach to) a Claude Code session for the current project.
# Session name derives from $PWD's basename.
bind = SUPER, C,        exec, kitty --title "Claude Code" -e claude-waybar-session

# Clipboard image → saved path (for pasting into Claude Code).
bind = SUPER SHIFT, V,  exec, claude-waybar-clip-img

# Region screenshot → clipboard → path helper.
# NOTE: SUPER+SHIFT+S is commonly bound to a screenshot tool (e.g. hyprshot on ZaneyOS).
# We use SUPER+SHIFT+P ("paste-shot") to avoid the collision.
bind = SUPER SHIFT, P,  exec, sh -c 'grim -g "$(slurp)" - | wl-copy && claude-waybar-clip-img'

# Keyboard fallback for the waybar clicks — acts on the OLDEST pending prompt.
# NOTE: SUPER+SHIFT+F is commonly bound to "toggle floating" in Hyprland defaults.
# Focus binding uses SUPER+CTRL+F instead.
bind = SUPER SHIFT, A,  exec, claude-waybar-accept accept
bind = SUPER SHIFT, X,  exec, claude-waybar-accept reject
bind = SUPER CTRL,  F,  exec, claude-waybar-accept focus

# WiFi picker (rofi-based NetworkManager frontend).
bind = SUPER, N,        exec, rofi-wifi-menu

# claude-waybar — Hyprland key bindings.
# Source in ~/.config/hypr/hyprland.conf:
#   source = ~/.config/claude-waybar/hypr/keybinds.conf

# Open (or attach to) a Claude Code session for the current project.
# Session name derives from $PWD's basename.
bind = SUPER, C,        exec, kitty --title "Claude Code" -e ~/.local/bin/claude-waybar-session

# Turn the image on the Wayland clipboard into a saved path, then put the path back on the clipboard.
# Paste with Ctrl+Shift+V inside Claude Code to give it the image.
bind = SUPER SHIFT, V,  exec, ~/.local/bin/claude-waybar-clip-img

# Region screenshot → clipboard → path helper (grim + slurp must be installed).
bind = SUPER SHIFT, S,  exec, grim -g "$(slurp)" - | wl-copy && ~/.local/bin/claude-waybar-clip-img

# Keyboard fallback for the waybar clicks — acts on the OLDEST pending prompt.
bind = SUPER SHIFT, A,  exec, ~/.local/bin/claude-waybar-accept accept
bind = SUPER SHIFT, X,  exec, ~/.local/bin/claude-waybar-accept reject
bind = SUPER SHIFT, F,  exec, ~/.local/bin/claude-waybar-accept focus

# WiFi picker (rofi-based NetworkManager frontend).
bind = SUPER, N,        exec, ~/.local/bin/rofi-wifi-menu

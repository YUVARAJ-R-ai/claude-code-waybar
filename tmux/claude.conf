# claude-waybar — tmux settings tailored for hosting Claude Code sessions.
#
# Merge into ~/.tmux.conf or source it:
#   source-file ~/.config/claude-waybar/tmux/claude.conf

# Kitty graphics protocol pass-through — required for image paste inside Claude Code.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Keep our claude-<project> session names stable.
set-option -g allow-rename off

# Big scrollback — Claude Code output gets long.
set-option -g history-limit 50000

# Mouse scroll / pane focus for convenience.
set -g mouse on

# Reduce escape-key latency so Escape (used to reject prompts) is instant.
set -sg escape-time 10

# Extended keys — forward Shift+Enter / Ctrl+Enter etc. through tmux so
# Claude Code receives them (default tmux swallows the modifier on Enter,
# which submits the prompt instead of inserting a newline).
#
# Two things had to line up for this to actually work:
#
# 1. `terminal-features` MUST be set with -ga (global-append), NOT -as
#    (server-append). terminal-features is a global user option, not a
#    server option, so `-s` silently sets it into the wrong scope.
#
# 2. Inside tmux, TERM defaults to "screen" — so a pattern of `xterm*` or
#    `kitty*` matches NOTHING and the extkeys feature is never actually
#    applied. Fix: force default-terminal to a modern value AND advertise
#    the feature under `tmux*` / `screen*` patterns for good measure.
set  -g  default-terminal "tmux-256color"
set  -s  extended-keys always
set  -s  extended-keys-format csi-u
set  -ga terminal-features 'tmux*:extkeys'
set  -ga terminal-features 'screen*:extkeys'
set  -ga terminal-features 'xterm*:extkeys'
set  -ga terminal-features 'kitty*:extkeys'
